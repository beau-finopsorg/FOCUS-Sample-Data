name: Generate sample data

# On-demand (and monthly) regeneration of the FOCUS sample datasets using the
# generate -> validate -> self-correct loop. Opens a pull request with the
# refreshed samples and their validation reports.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated versions to build (default: 1.2 1.3 1.4)"
        default: "1.2 1.3 1.4"
        required: false
      rows:
        description: "Rows per sample"
        default: "1000"
        required: false
      allow_persistent:
        description: "Allow PR even if only persistent (upstream model) failures remain"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 1 * *"   # 06:00 UTC on the 1st of each month

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tooling
        run: pip install -r tooling/requirements.txt

      - name: Generate + validate + self-correct
        working-directory: tooling
        run: |
          VERSIONS="${{ github.event.inputs.versions || '1.2 1.3 1.4' }}"
          ROWS="${{ github.event.inputs.rows || '1000' }}"
          EXTRA=""
          if [ "${{ github.event.inputs.allow_persistent || 'true' }}" = "true" ]; then
            EXTRA="--allow-persistent"
          fi
          mkdir -p reports
          python -m focusgen build-all --base .. --rows "$ROWS" --versions $VERSIONS $EXTRA
          for v in $VERSIONS; do
            python -m focusgen validate --version "$v" \
              --data-file "../FOCUS-$v/focus_sample.csv" --json \
              > "reports/validation-$v.json" || true
          done

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: regenerate FOCUS sample data"
          branch: "auto/regenerate-sample-data"
          title: "Regenerate FOCUS sample data"
          body: |
            Automated regeneration of FOCUS sample datasets via the generate ->
            validate -> self-correct loop (`tooling/focusgen`).

            Validation reports are attached under `tooling/reports/`.
          add-paths: |
            FOCUS-*/**
            tooling/reports/**
