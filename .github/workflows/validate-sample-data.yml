name: Validate sample data

# Validates every FOCUS-<version>/focus_sample*.csv against its version's
# requirements model (official for 1.2-1.4, back-ported for 1.0/1.1) on each
# push / PR. Uploads JSON reports.

# Read-only: this workflow only reads the repo, runs the validator, and uploads
# a report artifact.
permissions:
  contents: read

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "FOCUS-*/**"
      - "tooling/**"
      - ".github/workflows/validate-sample-data.yml"
  pull_request:
    paths:
      - "FOCUS-*/**"
      - "tooling/**"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focusgen unit tests
        run: python tooling/tests/test_focusgen.py

  validate:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install tooling
        run: pip install -r tooling/requirements.txt
      - name: Validate all sample data
        working-directory: tooling
        # --allow-persistent: do not fail CI on known upstream-model issues
        # (documented in tooling/FINDINGS.md). Remove the flag to enforce strictly.
        run: python -m focusgen validate-all --base .. --allow-persistent
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: tooling/reports/*.json
          if-no-files-found: ignore
